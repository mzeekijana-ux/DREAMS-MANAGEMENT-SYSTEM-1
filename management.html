<script>/* Taifa management app on Supabase: sign-in (email link), role from memberships, sync to public.app_records. */
(function () {
  'use strict';
  const SB = window.__SB_URL || 'https://ovijbsmxpkpwztfnkiga.supabase.co';
  const KEY = 'sb_publishable_mMeqGX0mGvDi9T9VpDxuvQ_vfTB2xdQ';   // publishable key: safe to be public; data is protected by row-level security
  const SKEY = 'sb-ovijbsmxpkpwztfnkiga-auth-token';             // same storage key supabase-js uses, so the main page's sign-in is shared
  // Do not force salesperson memberships to the Cloud Sales page. They can still use the
  // same authenticated management dashboard with reduced visibility enforced by role policies.
  const DOM = { act: 'daily_reports', plan: 'daily_reports', mis: 'daily_reports', tgt: 'management', acts: 'management', rop: 'inventory',
    ret: 'daily_reports', risk: 'risks', prod: 'inventory', inv: 'inventory', rt: 'gas_operations', yt: 'yas_operations', ya: 'float',
    pa: 'yas_operations', sdl: 'yas_operations', sl: 'sales', al: 'sales', spu: 'sales', dr: 'daily_reports', ap: 'workflows', jn: 'accounting', emp: 'hr' };
  const ARR = ['acts', 'ret', 'prod', 'inv', 'rt', 'ap', 'jn', 'emp', 'sl', 'al', 'spu', 'yt', 'ya', 'pa', 'sdl', 'dr'];
  const MAP = ['act', 'plan', 'risk', 'tgt', 'rop'];
  const MAP2 = ['mis'];
  const ALLC = ARR.concat(MAP, MAP2);
  const OVERLAP = 30000;
  let sess = null, user = null, ORG = null, snap = {}, cursor = null, flushing = false, again = false, timer = null, ordCtr = 0, deferred = false;
  const q = s => document.querySelector(s);
  const enc = encodeURIComponent;
  const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const nextOrd = () => Date.now() * 1000 + (ordCtr++ % 1000);
  const resetSnap = () => { snap = {}; ALLC.forEach(c => snap[c] = {}); };
  resetSnap();
  const canon = v => {
    if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : canon(x)).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
    return JSON.stringify(v);
  };

  const loadSess = () => { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; } };
  const saveSess = s => { sess = s; try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} };
  async function authFetch(path, opt) {
    const r = await fetch(SB + path, Object.assign({ headers: { apikey: KEY, 'Content-Type': 'application/json' } }, opt));
    let j = {}; try { j = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, j };
  }
  async function refresh() {
    if (!sess || !sess.refresh_token) return false;
    const r = await authFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: sess.refresh_token }) });
    if (!r.ok || !r.j.access_token) return false;
    saveSess({ access_token: r.j.access_token, refresh_token: r.j.refresh_token, token_type: 'bearer', expires_in: r.j.expires_in, expires_at: r.j.expires_at || Math.floor(Date.now() / 1000) + r.j.expires_in, user: sess.user });
    return true;
  }
  async function token() {
    if (!sess) throw Object.assign(new Error('Not signed in'), { status: 401 });
    if (sess.expires_at && sess.expires_at * 1000 - Date.now() < 60000) { if (!await refresh()) { sess = null; throw Object.assign(new Error('Session expired'), { status: 401 }); } }
    return sess.access_token;
  }
  async function rest(path, opt) {
    opt = opt || {};
    for (let attempt = 0; attempt < 2; attempt++) {
      const t = await token();
      const res = await fetch(SB + '/rest/v1' + path, {
        method: opt.method || 'GET',
        headers: Object.assign({ apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, opt.prefer ? { Prefer: opt.prefer } : {}),
        body: opt.body ? JSON.stringify(opt.body) : undefined,
      });
      if (res.status === 401 && attempt === 0) { if (await refresh()) continue; }
      let j = null; try { j = await res.json(); } catch (e) {}
      if (res.status === 401) throw Object.assign(new Error('Session expired'), { status: 401 });
      return { ok: res.ok, status: res.status, j };
    }
  }

  function flatten() {
    const out = {};
    ALLC.forEach(c => out[c] = {});
    ARR.forEach(c => {
      const a = typeof S !== 'undefined' ? S[c] : null;
      if (!Array.isArray(a)) return;
      const seen = {};
      a.forEach(it => {
        let r;
        if (it && typeof it === 'object' && !Array.isArray(it)) {
          if (!it._k) it._k = 'k' + rand();
          r = it._k;
          if (out[c][r]) { it._k = 'k' + rand(); r = it._k; }
        } else { const h = 'h' + hash(canon(it)); seen[h] = (seen[h] || 0) + 1; r = h + '.' + seen[h]; }
        out[c][r] = canon(it);
      });
    });
    MAP.forEach(c => { const o = S[c]; if (o && typeof o === 'object') Object.keys(o).forEach(k => { if (o[k] !== undefined) out[c][k] = canon(o[k]); }); });
    MAP2.forEach(c => { const o = S[c]; if (o && typeof o === 'object') Object.keys(o).forEach(m => { const x = o[m]; if (x && typeof x === 'object') Object.keys(x).forEach(i => { if (x[i] !== undefined) out[c][m + '|' + i] = canon(x[i]); }); }); });
    return out;
  }
  function assemble(c) {
    const recs = Object.keys(snap[c] || {}).map(r => Object.assign({ r }, snap[c][r]));
    if (ARR.includes(c)) { recs.sort((a, b) => (a.ord - b.ord) || (a.r < b.r ? -1 : 1)); return recs.map(x => JSON.parse(x.v)); }
    const o = {};
    if (MAP.includes(c)) { recs.forEach(x => { o[x.r] = JSON.parse(x.v); }); return o; }
    recs.forEach(x => { const p = x.r.split('|'); (o[p[0]] = o[p[0]] || {})[p[1]] = JSON.parse(x.v); });
    return o;
  }
  const emptyOf = c => ARR.includes(c) ? [] : {};
  function pendingCols() {
    const cur = flatten(), set = new Set();
    ALLC.forEach(c => {
      const a = cur[c], b = snap[c];
      for (const r in a) if (!b[r] || b[r].v !== a[r]) { set.add(c); break; }
      if (!set.has(c)) for (const r in b) if (!(r in a)) { set.add(c); break; }
    });
    return set;
  }
  const rid = (c, r) => c + '|' + r;
  function applyRows(rows) {
    const touched = new Set();
    rows.forEach(x => {
      const i = x.record_id.indexOf('|'); if (i < 0) return;
      const c = x.record_id.slice(0, i), r = x.record_id.slice(i + 1);
      if (!snap[c] || DOM[c] !== x.domain) return;
      const p = x.payload || {};
      if (p.x || p.v === undefined) delete snap[c][r]; else snap[c][r] = { v: canon(p.v), ver: x.updated_at, ord: p.o || 0 };
      touched.add(c);
    });
    return touched;
  }
  async function fetchRows(filter, sinceIso) {
    const all = [];
    for (let off = 0; ; off += 1000) {
      const r = await rest('/app_records?select=domain,record_id,payload,updated_at&organization_id=eq.' + ORG + filter + (sinceIso ? '&updated_at=gte.' + enc(sinceIso) : '') +
        '&order=updated_at.asc,domain.asc,record_id.asc&limit=1000&offset=' + off);
      if (!r.ok) throw new Error('Could not load data (' + r.status + ')');
      all.push(...r.j);
      if (r.j.length < 1000) break;
    }
    return all;
  }
  async function pull() {
    const since = cursor ? new Date(Date.parse(cursor) - OVERLAP).toISOString() : null;
    const rows = await fetchRows('', since);
    rows.forEach(x => { if (!cursor || x.updated_at > cursor) cursor = x.updated_at; });
    return applyRows(rows);
  }
  async function resync(c) {
    snap[c] = {};
    applyRows(await fetchRows('&record_id=like.' + enc(c + '|') + '*'));
  }

  const mk = (c, r, vstr, ord, x) => ({ organization_id: ORG, domain: DOM[c], record_id: rid(c, r), payload: x ? { x: 1, o: ord } : { v: JSON.parse(vstr), o: ord, x: 0 } });
  async function getRow(c, r) {
    const j = await rest('/app_records?select=domain,record_id,payload,updated_at&organization_id=eq.' + ORG + '&domain=eq.' + DOM[c] + '&record_id=eq.' + enc(rid(c, r)));
    return j.ok && j.j.length ? j.j[0] : null;
  }
  const rowFilter = (c, r) => '/app_records?organization_id=eq.' + ORG + '&domain=eq.' + DOM[c] + '&record_id=eq.' + enc(rid(c, r));
  async function pushOne(ch, out) {
    const c = ch.c, r = ch.r, ord = ch.ord || (snap[c][r] && snap[c][r].ord) || nextOrd();
    if (ch.base === 0) {
      const res = await rest('/app_records', { method: 'POST', prefer: 'return=representation', body: mk(c, r, ch.v, ord, false) });
      if (res.ok) { out.applied.push({ c, r, ver: res.j[0].updated_at, ord, v: ch.v }); return; }
      if (res.status === 403) { out.denied.push({ c }); return; }
      if (res.status === 409) {
        const ex = await getRow(c, r);
        if (ex && ex.payload && ex.payload.x) {
          const p = await rest(rowFilter(c, r) + '&updated_at=eq.' + enc(ex.updated_at), { method: 'PATCH', prefer: 'return=representation', body: { payload: mk(c, r, ch.v, ord, false).payload, updated_by: sess.user.id } });
          if (p.ok && p.j.length) { out.applied.push({ c, r, ver: p.j[0].updated_at, ord, v: ch.v }); return; }
        }
        if (ex) out.conflicts.push(ex); else out.denied.push({ c });
        return;
      }
      throw new Error('Save failed (' + res.status + ')');
    }
    const isDel = ch.v === null;
    const res = await rest(rowFilter(c, r) + '&updated_at=eq.' + enc(ch.base), { method: 'PATCH', prefer: 'return=representation', body: { payload: mk(c, r, ch.v, ord, isDel).payload, updated_by: sess.user.id } });
    if (!res.ok) { if (res.status === 403) { out.denied.push({ c }); return; } throw new Error('Save failed (' + res.status + ')'); }
    if (res.j.length) { out.applied.push({ c, r, ver: res.j[0].updated_at, ord, del: isDel, v: ch.v }); return; }
    const cur = await getRow(c, r);
    if (cur && cur.updated_at !== ch.base) out.conflicts.push(cur); else out.denied.push({ c });
  }

  function setStatus(t) {
    const el = q('#sync'); if (!el) return;
    el.textContent = t === 'ok' ? '● Saved' : t === 'saving' ? '● Saving…' : '● Offline – will retry';
    el.style.color = t === 'ok' ? '#34d399' : t === 'saving' ? '#fbbf24' : '#fb7185';
  }
  function toast(msg) {
    let t = q('#tgToast');
    if (!t) { t = document.createElement('div'); t.id = 'tgToast'; document.body.appendChild(t); }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 8000);
  }
  function safeRender() {
    const m = q('#modal');
    if (m && m.style.display === 'flex') { deferred = true; return; }
    try { render(); if (typeof tw === 'function') tw(); } catch (e) {}
  }
  const rebuild = c => { S[c] = assemble(c); };
  const pickState = () => { const d = {}; ALLC.forEach(c => { d[c] = S[c]; }); return d; };

  async function flush() {
    if (flushing) { again = true; return; }
    flushing = true;
    try {
      for (let guard = 0; guard < 5; guard++) {
        again = false;
        const cur = flatten(), ch = [];
        ALLC.forEach(c => {
          Object.keys(cur[c]).forEach(r => {
            const s = snap[c][r];
            if (!s) ch.push({ c, r, v: cur[c][r], base: 0, ord: nextOrd() });
            else if (s.v !== cur[c][r]) ch.push({ c, r, v: cur[c][r], base: s.ver });
          });
          Object.keys(snap[c]).forEach(r => { if (!(r in cur[c])) ch.push({ c, r, v: null, base: snap[c][r].ver }); });
        });
        if (!ch.length) { setStatus('ok'); break; }
        setStatus('saving');
        const out = { applied: [], conflicts: [], denied: [] };
        const fresh = ch.filter(x => x.base === 0), upd = ch.filter(x => x.base !== 0);
        if (fresh.length > 1) {
          const res = await rest('/app_records', { method: 'POST', prefer: 'return=representation', body: fresh.map(x => mk(x.c, x.r, x.v, x.ord, false)) });
          if (res.ok) res.j.forEach(row => {
            const i = row.record_id.indexOf('|'), c = row.record_id.slice(0, i), r = row.record_id.slice(i + 1);
            const x = fresh.find(f => f.c === c && f.r === r);
            if (x) out.applied.push({ c, r, ver: row.updated_at, ord: x.ord, v: x.v });
          });
          else for (const x of fresh) await pushOne(x, out);
        } else for (const x of fresh) await pushOne(x, out);
        for (let i = 0; i < upd.length; i += 5) await Promise.all(upd.slice(i, i + 5).map(x => pushOne(x, out)));
        out.applied.forEach(a => { if (a.del) delete snap[a.c][a.r]; else snap[a.c][a.r] = { v: a.v, ver: a.ver, ord: a.ord }; });
        const touched = applyRows(out.conflicts.filter(Boolean));
        for (const c of new Set(out.denied.map(d => d.c))) { await resync(c); touched.add(c); }
        if (touched.size) { touched.forEach(rebuild); safeRender(); }
        if (out.conflicts.length) toast('Someone else changed the same record at the same time. Their version was kept and your screen was refreshed – please check and re-enter if needed.');
        if (out.denied.length) toast('Your role is not allowed to save some of these changes, so they were not kept.');
        if (!again && !out.conflicts.length && !out.denied.length) { setStatus('ok'); break; }
      }
    } catch (e) {
      if (e && e.status === 401) { location.reload(); return; }
      setStatus('off');
      try { localStorage.setItem('gym_unsynced', JSON.stringify({ u: user && user.email, d: pickState() })); } catch (x) {}
      clearTimeout(timer); timer = setTimeout(flush, 15000);
    } finally { flushing = false; }
  }
  async function poll() {
    if (!user || flushing) return;
    try {
      await flush();
      const pend = pendingCols();
      const touched = await pull();
      let did = false;
      touched.forEach(c => { if (!pend.has(c)) { rebuild(c); did = true; } });
      if (did) safeRender();
    } catch (e) { setStatus('off'); }
  }

  function mergeIn(d) {
    let n = 0;
    const strip = it => { if (it && typeof it === 'object' && !Array.isArray(it)) { const z = Object.assign({}, it); delete z._k; return canon(z); } return canon(it); };
    ARR.forEach(c => { if (!Array.isArray(d[c])) return; S[c] = S[c] || []; const have = new Set(S[c].map(strip)); d[c].forEach(it => { const s = strip(it); if (!have.has(s)) { have.add(s); S[c].push(it); n++; } }); });
    MAP.forEach(c => { if (!d[c] || typeof d[c] !== 'object') return; S[c] = S[c] || {}; Object.keys(d[c]).forEach(k => { if (!(k in S[c])) { S[c][k] = d[c][k]; n++; } }); });
    MAP2.forEach(c => { if (!d[c] || typeof d[c] !== 'object') return; S[c] = S[c] || {}; Object.keys(d[c]).forEach(m => { S[c][m] = S[c][m] || {}; Object.keys(d[c][m] || {}).forEach(i => { if (!(i in S[c][m])) { S[c][m][i] = d[c][m][i]; n++; } }); }); });
    return n;
  }

  window.__LOAD = function () {
    const o = {};
    ALLC.forEach(c => { o[c] = Object.keys(snap[c]).length ? assemble(c) : emptyOf(c); });
    try { const p = JSON.parse(localStorage.getItem('gym_pref') || '{}'); if (p.lang) o.lang = p.lang; } catch (e) {}
    return o;
  };
  window.__SAVE = function () {
    try { localStorage.setItem('gym_pref', JSON.stringify({ lang: S.lang || 'en' })); } catch (e) {}
    setStatus('saving'); clearTimeout(timer); timer = setTimeout(flush, 400);
  };
  window.__AFTER_MODAL = function () { if (deferred) { deferred = false; safeRender(); } };
  window.__SIGNOUT = async function () {
    try { if (sess) await fetch(SB + '/auth/v1/logout', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + sess.access_token } }); } catch (e) {}
    try { localStorage.removeItem(SKEY); } catch (e) {}
    location.reload();
  };

  const gate = q('#gate');
  const say = (msg, bad) => { const e = q('#gmsg'); if (!e) return; e.textContent = msg || ''; e.style.color = bad ? '#fb7185' : '#9bb7cc'; };
  function showLogin(note) {
    gate.style.display = 'flex';
    q('#gbox').innerHTML = '<h2>Sign in</h2><p class="gs">Taifa Gas &amp; Yas/Mixx – Management System</p>' +
      '<p class="gs">Use the email address that was invited to the system. We will email you a one-time sign-in link.</p>' +
      '<label>Email address</label><input id="ge" type="email" autocomplete="email" autocapitalize="none">' +
      '<button id="gb" class="p">Email me a sign-in link</button><p id="gmsg" class="gs"></p>' +
      '<p class="gs">Sales accounts stay in this dashboard with limited permissions; sensitive areas remain protected by role-based policies.</p>';
    if (note) say(note, true);
    q('#gb').onclick = async () => {
      const email = q('#ge').value.trim().toLowerCase();
      if (!/^\S+@\S+\.\S+$/.test(email)) return say('Enter a valid email address.', true);
      q('#gb').disabled = true; say('Sending…');
      const r = await authFetch('/auth/v1/otp?redirect_to=' + enc(location.origin + location.pathname), { method: 'POST', body: JSON.stringify({ email, create_user: false }) });
      if (r.ok) say('Check your email and open the link on this device. You can close this page.');
      else { say((r.j && (r.j.msg || r.j.error_description || r.j.message)) || 'Could not send the link.', true); q('#gb').disabled = false; }
    };
  }
  function showBlock(title, html) { gate.style.display = 'flex'; q('#gbox').innerHTML = '<h2>' + title + '</h2><p class="gs">' + html + '</p><button id="gb" class="p">Sign out</button>'; q('#gb').onclick = () => window.__SIGNOUT(); }

  async function start() {
    resetSnap(); cursor = null;
    const m = await rest('/memberships?select=organization_id,role,active&user_id=eq.' + sess.user.id + '&active=eq.true');
    if (!m.ok || !m.j.length) return showBlock('No access', 'This account (' + (sess.user.email || '') + ') is not linked to the organization. Ask the Managing Director to add you.');
    ORG = m.j[0].organization_id;
    user = { email: sess.user.email, name: sess.user.email, username: sess.user.email, role: m.j[0].role, id: sess.user.id };
    await pull();
    window.TG = { user, flush, poll, mergeIn, toast, ALLC, signOut: window.__SIGNOUT };
    const run = sel => document.querySelectorAll(sel).forEach(t => { const s = document.createElement('script'); s.textContent = t.textContent; document.body.appendChild(s); });
    run('script[type="text/plain"][data-app]');
    run('script[type="text/plain"][data-post]');
    gate.style.display = 'none'; setStatus('ok');
    setInterval(poll, 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
    window.addEventListener('online', poll);
  }

  (async function boot() {
    try {
      if (location.hash.length > 1) {
        const h = new URLSearchParams(location.hash.slice(1));
        if (h.get('error_description')) { history.replaceState(null, '', location.pathname); return showLogin(h.get('error_description').replace(/\+/g, ' ')); }
        if (h.get('access_token')) {
          const u = await authFetch('/auth/v1/user', { headers: { apikey: KEY, Authorization: 'Bearer ' + h.get('access_token') } });
          if (u.ok) saveSess({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), token_type: 'bearer', expires_in: +h.get('expires_in') || 3600, expires_at: +h.get('expires_at') || Math.floor(Date.now() / 1000) + 3600, user: u.j });
          history.replaceState(null, '', location.pathname);
        }
      }
      sess = sess || loadSess();
      if (!sess || !sess.access_token) return showLogin();
      if (!sess.user || !sess.user.id) { const u = await authFetch('/auth/v1/user', { headers: { apikey: KEY, Authorization: 'Bearer ' + sess.access_token } }); if (!u.ok) return showLogin(); sess.user = u.j; }
      await start();
    } catch (e) {
      if (e && e.status === 401) return showLogin('Your session expired. Please sign in again.');
      gate.style.display = 'flex';
      q('#gbox').innerHTML = '<h2>Cannot start</h2><p class="gs">' + (e.message || 'Cannot reach the server.') + ' Check your internet connection and reload the page.</p>';
    }
  })();
})();
</script>

];

const TABS=[['dash','Dashboard'],['score','Scorecard'],['ret','Daily Returns'],['plan','Action Plan'],['mis','Monthly MI Pack'],['risk','Risk Register'],['bak','Backup']];
